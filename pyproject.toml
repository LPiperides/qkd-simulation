[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qkd-simulation"
version = "0.2.0"
description = "BB84, B92, SARG04 and E91 quantum key distribution simulated on Qiskit Aer: eavesdropping, depolarizing noise, QBER, CHSH tests, mutual information and secret-key-rate estimates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lito Piperides", email = "piperidesl@gmail.com" }]
keywords = ["quantum", "qkd", "bb84", "b92", "sarg04", "e91", "chsh", "qiskit", "cryptography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
qkd-simulation = "qkd_sim.cli:main"

[project.urls]
Repository = "https://github.com/LPiperides/qkd-simulation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
